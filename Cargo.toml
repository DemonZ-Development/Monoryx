[package]
name = "monoryx"
version = "0.1.0"
edition = "2021"
description = "MONORYX - Minecraft, without the clutter. A lightweight native Minecraft Java Edition launcher."
authors = ["DemonZDevelopment"]
license = "Apache-2.0"
repository = "https://github.com/DemonZDevelopment/monoryx"
homepage = "https://github.com/DemonZDevelopment/monoryx"
readme = "README.md"
keywords = ["minecraft", "launcher", "egui"]
categories = ["games"]
rust-version = "1.85"

[[bin]]
name = "monoryx"
path = "src/main.rs"

[features]
default = []

[dependencies]
eframe = { version = "0.32", features = ["default_fonts", "glow"] }
egui = "0.32"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
uuid = { version = "1", features = ["v3", "v4", "v5", "serde"] }
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.8"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
directories = "6"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures = "0.3"
semver = { version = "1", features = ["serde"] }
sysinfo = "0.36"
url = "2"
open = "5"
tempfile = "3"
async-trait = "0.1"
bytes = "1"
image = "0.25"
rfd = "0.15"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
