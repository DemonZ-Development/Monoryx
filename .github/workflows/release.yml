name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binary
        run: cargo build --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.3.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\monoryx.iss
      - name: Package Windows Zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.3.0" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item installer\dist\*.exe dist\
          Compress-Archive -Path target\release\monoryx.exe, README.md, LICENSE, CHANGELOG.md -DestinationPath "dist\monoryx-v$version-windows-x64.zip" -Force
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)"
          }
          Get-FileHash dist\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } | Set-Content dist\SHA256SUMS.txt
      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Build release binary
        run: cargo build --release
      - name: Package Linux assets
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then VERSION="1.3.0"; fi
          mkdir -p dist/package
          cp target/release/monoryx dist/package/
          chmod +x dist/package/monoryx
          cp installer/install.sh dist/package/
          chmod +x dist/package/install.sh
          cp installer/uninstall.sh dist/package/
          chmod +x dist/package/uninstall.sh
          cp -r assets dist/package/ 2>/dev/null || true
          cp README.md LICENSE CHANGELOG.md dist/package/ 2>/dev/null || true
          tar -czf "dist/monoryx-v${VERSION}-linux-x64.tar.gz" -C dist/package .
          cp installer/install.sh "dist/monoryx-installer-linux.sh"
          rm -rf dist/package
      - name: Upload Linux Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            dist/*.tar.gz
            dist/*.sh

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="v1.3.0"; fi
          awk -v version="${TAG#v}" '
            $0 == "# MONORYX " version { keep=1 }
            keep && /^# MONORYX / && $0 != "# MONORYX " version { exit }
            keep { print }
          ' CHANGELOG.md > /tmp/monoryx-release-notes.md
          if [ ! -s /tmp/monoryx-release-notes.md ]; then cp CHANGELOG.md /tmp/monoryx-release-notes.md; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MONORYX $TAG" --notes-file /tmp/monoryx-release-notes.md --latest
          fi
          for f in release-assets/*; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --clobber
            fi
          done
