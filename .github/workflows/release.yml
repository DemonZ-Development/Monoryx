name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version (defaults to Cargo.toml)
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          package_version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          version = os.environ.get("REQUESTED_VERSION", "").strip().removeprefix("v") or package_version
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit("Invalid release version")
          if version != package_version:
              raise SystemExit("Release version must match Cargo.toml")
          tag = f"v{version}"
          if os.environ["GITHUB_EVENT_NAME"] == "push" and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit("Release tag must match Cargo.toml")
          try:
              tag_commit = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
              head_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          except subprocess.CalledProcessError:
              raise SystemExit("Create the release tag before running this workflow")
          if tag_commit != head_commit:
              raise SystemExit("Run this workflow from the release tag's commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag={tag}\n")
          PY

  test:
    name: Format, Lint and Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 libasound2-dev libudev-dev libdbus-1-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features

  build-windows:
    needs: [test, resolve-version]
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      MONORYX_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binary
        run: cargo build --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $version = $env:MONORYX_VERSION
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\monoryx.iss
      - name: Package Windows Zip
        shell: pwsh
        run: |
          $version = $env:MONORYX_VERSION
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item installer\dist\*.exe dist\
          Copy-Item target\release\monoryx-updater.exe dist\
          Copy-Item target\release\monoryx.exe dist\monoryx-update.exe
          Compress-Archive -Path target\release\monoryx.exe, target\release\monoryx-updater.exe, README.md, LICENSE, CHANGELOG.md -DestinationPath "dist\monoryx-v$version-windows-x64.zip" -Force
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)"
          }
          Get-FileHash dist\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } | Set-Content dist\SHA256SUMS.txt
      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*

  build-linux:
    needs: [test, resolve-version]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONORYX_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 libasound2-dev libudev-dev libdbus-1-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Build release binary
        run: cargo build --release
      - name: Package Linux assets
        run: |
          VERSION="$MONORYX_VERSION"
          mkdir -p dist/package
          cp target/release/monoryx dist/package/
          chmod +x dist/package/monoryx
          cp installer/install.sh dist/package/
          chmod +x dist/package/install.sh
          cp installer/uninstall.sh dist/package/
          chmod +x dist/package/uninstall.sh
          cp -r assets dist/package/ 2>/dev/null || true
          cp README.md LICENSE CHANGELOG.md dist/package/ 2>/dev/null || true
          tar -czf "dist/monoryx-v${VERSION}-linux-x64.tar.gz" -C dist/package .
          cp installer/install.sh "dist/monoryx-installer-linux.sh"
          rm -rf dist/package
      - name: Upload Linux Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            dist/*.tar.gz
            dist/*.sh

  build-macos:
    needs: [test, resolve-version]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MONORYX_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build macOS binaries (Universal)
        run: |
          cargo build --release --target aarch64-apple-darwin --bin monoryx --bin monoryx-updater
          cargo build --release --target x86_64-apple-darwin --bin monoryx --bin monoryx-updater
          mkdir -p target/universal
          lipo -create -output target/universal/monoryx target/aarch64-apple-darwin/release/monoryx target/x86_64-apple-darwin/release/monoryx
          lipo -create -output target/universal/monoryx-updater target/aarch64-apple-darwin/release/monoryx-updater target/x86_64-apple-darwin/release/monoryx-updater
      - name: Package macOS Application (.dmg and .tar.gz)
        run: |
          VERSION="$MONORYX_VERSION"
          chmod +x installer/macos/package-macos.sh
          installer/macos/package-macos.sh "$VERSION" target/universal dist
          mkdir -p dist/arch
          cp target/aarch64-apple-darwin/release/monoryx dist/arch/
          cp target/aarch64-apple-darwin/release/monoryx-updater dist/arch/
          cp README.md LICENSE CHANGELOG.md dist/arch/ 2>/dev/null || true
          tar -czf "dist/monoryx-v${VERSION}-macos-arm64.tar.gz" -C dist/arch .
          rm -rf dist/arch/*
          cp target/x86_64-apple-darwin/release/monoryx dist/arch/
          cp target/x86_64-apple-darwin/release/monoryx-updater dist/arch/
          cp README.md LICENSE CHANGELOG.md dist/arch/ 2>/dev/null || true
          tar -czf "dist/monoryx-v${VERSION}-macos-x64.tar.gz" -C dist/arch .
          rm -rf dist/arch
      - name: Upload macOS Assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            dist/*.dmg
            dist/*.tar.gz

  publish-release:
    needs: [test, resolve-version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONORYX_TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          TAG="$MONORYX_TAG"
          awk -v version="${TAG#v}" '
            $0 == "# MONORYX " version { keep=1 }
            keep && /^# MONORYX / && $0 != "# MONORYX " version { exit }
            keep { print }
          ' CHANGELOG.md > /tmp/monoryx-release-notes.md
          if [ ! -s /tmp/monoryx-release-notes.md ]; then cp CHANGELOG.md /tmp/monoryx-release-notes.md; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MONORYX $TAG" --notes-file /tmp/monoryx-release-notes.md --latest
          fi
          for f in release-assets/*; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --clobber
            fi
          done
